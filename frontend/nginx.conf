server {
    listen 3000;
    server_name localhost;

    # Статика React
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Сессионная cookie — first-party: API ходит через тот же origin
    # (bionicpro-auth в docker-compose доступен по имени сервиса)
    location /api/ {
        proxy_pass http://bionicpro-auth:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /login { proxy_pass http://bionicpro-auth:8000; proxy_set_header Host $host; }
    location = /callback { proxy_pass http://bionicpro-auth:8000; proxy_set_header Host $host; }
    location = /logout { proxy_pass http://bionicpro-auth:8000; proxy_set_header Host $host; }

    add_header 'Access-Control-Allow-Origin' '*';
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';

    error_page 500 502 503 504 /50x.html;
    location = /50x.html { root /usr/share/nginx/html; }
}
