# Задание 3: эмуляция CDN — Nginx reverse proxy с кешированием статики (отчёты из Minio/S3).
# Схема: клиент -> nginx (/reports-cdn/*) -> cache on disk -> minio:9000/reports/*
# Механизм обновления кеша:
#   * proxy_cache_valid 200 10m — отчёт живёт в кеше 10 минут;
#   * при перегенерации отчёта (новый период = новый ключ объекта user=<sub>/<from>_<to>.json)
#     URL меняется — старая закешированная копия больше не запрашивается;
#   * cache purge по X-Refresh выполняется сервисом reports-api при пересборке.

proxy_cache_path /var/cache/nginx/reports
                 levels=1:2
                 keys_zone=reports_cache:10m
                 max_size=1g
                 inactive=30m
                 use_temp_path=off;

# Garage v1.1 не поддерживает анонимный доступ к S3, поэтому CDN-слой
# проксирует на reports-api, который делает подписанный GET из S3 (server-side)
upstream s3_reports {
    server reports-api:8001;
}

server {
    listen 8090;

    # CDN-эндпоинт отчётов: /reports-cdn/<object-key> -> Minio bucket "reports"
    location /reports-cdn/ {
        proxy_pass http://s3_reports/internal/object/;

        proxy_http_version 1.1;
        proxy_set_header X-CDN-Token bionicpro-cdn;
        proxy_set_header Connection "";

        # кеширование
        proxy_cache reports_cache;
        proxy_cache_key $uri;
        proxy_cache_valid 200 10m;
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

        add_header X-Cache-Status $upstream_cache_status;
        add_header Cache-Control "public, max-age=600";

        # доставать объекты из бакета можно только на чтение
        limit_except GET HEAD { deny all; }
    }

    location /healthz {
        access_log off;
        return 200 "cdn-ok\n";
    }
}
