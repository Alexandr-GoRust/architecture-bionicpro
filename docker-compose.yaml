version: '3.8'

services:
  # ---------- Задание 1: Keycloak + Postgres ----------
  keycloak_db:
    image: postgres:14
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - ./postgres-keycloak-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks: [bionicpro]

  keycloak:
    image: quay.io/keycloak/keycloak:21.1
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
      # Задание 1, задача 6: креды Яндекс ID (для локального запуска подставьте свои)
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-yandex-client-id}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-yandex-client-secret}
    command:
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    depends_on:
      - keycloak_db
    networks: [bionicpro]

  # Задание 1, задача 4: LDAP-сервер OpenLDAP (пользователи/роли в ldap/config.ldif)
  ldap:
    image: osixia/openldap:1.5.0
    environment:
      LDAP_ORGANISATION: BionicPRO
      LDAP_DOMAIN: example.com
      LDAP_ADMIN_PASSWORD: admin
      LDAP_CONFIG_PASSWORD: config
      LDAP_REMOVE_CONFIG_AFTER_SETUP: "false"
    command: [--copy-service, --loglevel, "debug"]
    volumes:
      - ./ldap/config.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/config.ldif
    ports:
      - "1389:389"
    networks: [bionicpro]

  # Задание 1, задача 3: сервис работы с токенами и сессиями
  bionicpro-auth:
    build:
      context: ./bionicpro-auth
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: reports-realm
      AUTH_CLIENT_ID: bionicpro-auth
      AUTH_CLIENT_SECRET: bionicpro-auth-secret
      AUTH_REDIRECT_URL: http://localhost:8000/callback
      FRONTEND_URL: http://localhost:3000
      REPORTS_API_URL: http://reports-api:8001
      LISTEN: ":8000"
    ports:
      - "8000:8000"
    depends_on:
      - keycloak
    networks: [bionicpro]

  # ---------- Задание 2: фронтенд, API отчётов, ClickHouse, Airflow ----------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      REACT_APP_AUTH_URL: http://localhost:8000
    depends_on:
      - bionicpro-auth
    networks: [bionicpro]

  reports-api:
    build:
      context: ./reports-api
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: reports-realm
      CLICKHOUSE_ADDR: clickhouse:9000
      CLICKHOUSE_DB: reports
      CH_USER: reports_api
      CH_PASSWORD: reports_api_pass
      S3_ENDPOINT: minio:3900
      S3_ACCESS_KEY: GK78bf849c1a6aafddb379b319
      S3_SECRET_KEY: 06d9927e8ba8a9de154aed817e42040a9d2ef225110ddd3be8967706357ce625
      S3_BUCKET: reports
      CDN_BASE_URL: http://localhost:8090/reports-cdn
      LISTEN: ":8001"
    ports:
      - "8001:8001"
    depends_on:
      - keycloak
      - clickhouse
      - minio
    networks: [bionicpro]

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    environment:
      CLICKHOUSE_DB: reports
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
    volumes:
      - ./clickhouse/init:/docker-entrypoint-initdb.d
      - ch-data:/var/lib/clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    networks: [bionicpro]

  # Задание 4: CRM (PostgreSQL, источник CDC) + Kafka + Kafka Connect (Debezium)
  crm_db:
    image: postgres:16
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_password
      #Debezium требует logical replication
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
    volumes:
      - ./crm/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5434:5432"
    networks: [bionicpro]

  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
      - "29092:29092"
    networks: [bionicpro]

  kafka-connect:
    image: debezium/connect:2.6
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: bionicpro-connect
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    volumes:
      - ./debezium:/debezium:ro
    ports:
      - "8083:8083"
    depends_on:
      - kafka
      - crm_db
    networks: [bionicpro]

  debezium-register:
    image: curlimages/curl:8.8.0
    volumes:
      - ./debezium:/debezium:ro
    entrypoint: ["/bin/sh", "/debezium/register_connector.sh"]
    environment:
      KAFKA_CONNECT_URL: http://kafka-connect:8083
    depends_on:
      - kafka-connect
    restart: "no"
    networks: [bionicpro]

  # Задание 2: Airflow (ETL по расписанию)
  airflow:
    build:
      context: ./airflow
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow_db/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: bionicpro-airflow
      AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth"
      CH_HOST: clickhouse
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
    command: standalone
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    ports:
      - "8081:8080"
    depends_on:
      - airflow_db
      - clickhouse
    networks: [bionicpro]

  airflow_db:
    image: postgres:16
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    networks: [bionicpro]

  # ---------- Задание 3: S3 (Minio) + CDN (Nginx reverse proxy cache) ----------
  # S3-хранилище: MinIO удалён из Docker Hub (сент. 2026) — используем
  # S3-совместимый Garage (API MinIO/S3 совместим, reports-api работает без правок)
  minio:
    image: dxflrs/garage:v1.1.0
    entrypoint: ["/garage", "server"]
    environment:
      GARAGE_CONFIG_FILE: /etc/garage/garage.toml
    volumes:
      - ./garage/garage.toml:/etc/garage/garage.toml:ro
      - minio-data:/var/lib/garage/data
      - minio-meta:/var/lib/garage/meta
    ports:
      - "9010:3900"   # S3 API
      - "9001:3901"   # админ-панель
    networks: [bionicpro]

  cdn:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx-cdn.conf:/etc/nginx/conf.d/default.conf:ro
      - cdn-cache:/var/cache/nginx
    ports:
      - "8090:8090"
    depends_on:
      - minio
    networks: [bionicpro]

volumes:
  ch-data:
  minio-data:
  minio-meta:
  cdn-cache:

networks:
  bionicpro:
    driver: bridge
